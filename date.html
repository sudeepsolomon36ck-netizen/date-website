<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Our Date ❤️</title>

    <link rel="stylesheet" href="style.css">
	<meta name="robots" content="noindex, nofollow">
</head>

<body class="date-page">

    <!-- Dark overlay -->
    <div class="date-overlay"></div>


    <!-- Floating hearts -->
    <div class="date-hearts">
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
    </div>


    <!-- Main box -->
    <div class="date-box">

        <div class="calendar-heart">
            ❤️
        </div>


        <h1>
            Yay! You Said Yes! 💕
        </h1>


        <p class="date-intro">
            Now let's choose a day for our little adventure 🌸
        </p>


        <!-- DATE FORM -->
        <form
            id="dateForm"
            action="https://formsubmit.co/sudeepck4@gmail.com"
            method="POST"
        >

            <!-- Email subject -->
            <input
                type="hidden"
                name="_subject"
                value="New Date Website Response ❤️"
            >


            <!-- Makes the email look cleaner -->
            <input
                type="hidden"
                name="_template"
                value="table"
            >


            <!-- Prevent FormSubmit's default redirect -->
            <input
                type="hidden"
                name="_captcha"
                value="false"
            >


            <!-- Calendar -->
            <div class="calendar-card">

                <div class="calendar-title">
                    📅 Pick Our Date
                </div>


                <input
                    type="date"
                    id="datePicker"
                    name="Selected Date"
                    required
                >

            </div>


            <!-- Confirm button -->
            <button
                type="submit"
                class="enter-btn"
                id="confirmButton"
            >
                Confirm Date ✨
            </button>

        </form>


        <p class="date-bottom">
            Choose a day you'll remember ❤️
        </p>

    </div>



    <script>

        const form =
            document.getElementById("dateForm");

        const datePicker =
            document.getElementById("datePicker");

        const confirmButton =
            document.getElementById("confirmButton");


        form.addEventListener("submit", async function(event) {

            /*
             Stop the normal FormSubmit redirect.
            */
            event.preventDefault();


            /*
             Check whether a date was selected.
            */
            if (datePicker.value === "") {

                alert("Please choose a date first 😊");

                return;
            }


            /*
             Change button while sending.
            */
            confirmButton.textContent =
                "Sending... 💌";

            confirmButton.disabled = true;


            /*
             Create the form data.
            */
            const formData =
                new FormData(form);


            try {

                /*
                 Send the information to FormSubmit.
                */
                const response =
                    await fetch(
                        "https://formsubmit.co/ajax/sudeepck4@gmail.com",
                        {
                            method: "POST",

                            body: formData,

                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );


                /*
                 If FormSubmit accepts the response,
                 save the date and go to fixed.html.
                */
                if (response.ok) {

                    localStorage.setItem(
                        "selectedDate",
                        datePicker.value
                    );


                    window.location.href =
                        "fixed.html";

                }

                else {

                    throw new Error(
                        "Form submission failed"
                    );

                }

            }

            catch (error) {

                console.error(error);

                alert(
                    "Something went wrong while sending the date. Please try again."
                );


                confirmButton.textContent =
                    "Confirm Date ✨";

                confirmButton.disabled = false;
            }

        });

    </script>

</body>

</html>
